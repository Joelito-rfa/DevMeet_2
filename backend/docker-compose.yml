# Base MySQL prête à l'emploi pour le développement (port 3307 pour ne pas gêner un MySQL local).
# Lancer depuis backend/ :  docker compose up -d
name: devmeet
services:
  mysql:
    image: mysql:8.4
    container_name: devmeet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devmeet
      MYSQL_DATABASE: devmeet
    ports:
      - "3307:3306"
    volumes:
      - devmeet-mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  devmeet-mysql:
