<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04121a"/>
      <stop offset="0.5" stop-color="#0a3140"/>
      <stop offset="1" stop-color="#0b6478"/>
    </linearGradient>
    <radialGradient id="glow2a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="stroke2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg2)"/>
  <circle cx="220" cy="200" r="560" fill="url(#glow2a)"/>
  <circle cx="1040" cy="1240" r="520" fill="url(#glow2b)"/>

  <!-- tableau -->
  <g transform="rotate(-3 600 720)">
    <rect x="110" y="380" width="980" height="720" rx="34" fill="#ffffff" fill-opacity="0.055" stroke="url(#stroke2)" stroke-width="2"/>
    <rect x="110" y="380" width="980" height="720" rx="34" fill="url(#dots2)"/>

    <!-- post-it -->
    <rect x="170" y="436" width="180" height="160" rx="8" fill="#fbbf24" fill-opacity="0.82" transform="rotate(-5 260 516)"/>
    <rect x="196" y="492" width="126" height="10" rx="5" fill="#78350f" fill-opacity="0.35" transform="rotate(-5 260 516)"/>
    <rect x="196" y="520" width="96" height="10" rx="5" fill="#78350f" fill-opacity="0.25" transform="rotate(-5 260 516)"/>

    <rect x="392" y="460" width="160" height="140" rx="8" fill="#22d3ee" fill-opacity="0.7" transform="rotate(4 472 530)"/>
    <rect x="416" y="512" width="112" height="10" rx="5" fill="#083344" fill-opacity="0.4" transform="rotate(4 472 530)"/>

    <!-- formes dessinées -->
    <rect x="640" y="440" width="200" height="130" rx="18" fill="none" stroke="#a7f3d0" stroke-opacity="0.85" stroke-width="5"/>
    <circle cx="940" cy="512" r="68" fill="none" stroke="#67e8f9" stroke-opacity="0.8" stroke-width="5"/>
    <path d="M840 512 h36" stroke="#a7f3d0" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
    <path d="M862 498 l16 14 -16 14" fill="none" stroke="#a7f3d0" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="180" y="680" width="360" height="150" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="14 12"/>
    <path d="M560 755 h60" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="14 12" stroke-linecap="round"/>
    <rect x="640" y="680" width="360" height="150" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3"/>
    <rect x="692" y="726" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="692" y="756" width="130" height="12" rx="6" fill="#ffffff" fill-opacity="0.18"/>

    <path d="M240 940 q90 -60 190 0 t200 -10 t180 -30" fill="none" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
    <path d="M240 990 q120 40 220 -10" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>

    <!-- curseurs -->
    <path d="M0 0 L20 48 L26 28 L46 22 Z" transform="translate(520 880)" fill="#34d399"/>
    <rect x="546" y="896" width="104" height="32" rx="10" fill="#34d399" fill-opacity="0.92"/>
    <path d="M0 0 L20 48 L26 28 L46 22 Z" transform="translate(880 1020)" fill="#fbbf24"/>
    <rect x="906" y="1036" width="94" height="32" rx="10" fill="#fbbf24" fill-opacity="0.92"/>
  </g>

  <!-- outils flottants -->
  <g transform="rotate(8 940 1180)">
    <rect x="820" y="1090" width="240" height="180" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="880" cy="1160" r="18" fill="none" stroke="#67e8f9" stroke-width="4"/>
    <rect x="922" y="1142" width="44" height="38" rx="10" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <path d="M880 1210 h60 l-30 -26 z" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linejoin="round"/>
    <path d="M970 1194 v34" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <circle cx="150" cy="1240" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="150" cy="1240" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
